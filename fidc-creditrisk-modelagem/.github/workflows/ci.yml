name: ci

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python pipeline_fidc_creditrisk.py
      # A igualdade README x outputs é conferida localmente; no CI as tabelas são regeneradas
      # porque somas em ponto flutuante podem variar na última casa entre plataformas.
      - run: python scripts/atualizar_readme.py
      - run: python scripts/verify_output.py
